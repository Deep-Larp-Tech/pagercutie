<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PagerCutie</title>
    <script>
      // Runs before first paint so the page never flashes the wrong theme (DESIGN.md §3).
      ;(function () {
        var choice = 'system'
        try {
          var stored = localStorage.getItem('theme')
          if (stored === 'light' || stored === 'dark' || stored === 'system') choice = stored
        } catch (e) {}
        var theme =
          choice === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : choice
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <!-- Splash: copy of the Logo component, replaced by React's first render (DESIGN.md §12, ADR-0041). -->
    <style>
      #splash {
        --splash-delay: 300ms;
        --splash-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fafafc;
        color: #171721;
        visibility: hidden;
        animation: splash-reveal 0s var(--splash-delay) forwards;
      }
      #splash p {
        position: absolute;
        top: calc(50% + 48px);
        margin: 0;
        padding: 0 16px;
        font: 14px/20px system-ui, sans-serif;
        color: #62626c;
        visibility: hidden;
        animation: splash-reveal 0s 10s forwards;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) #splash {
          background: #0c0c11;
          color: #f3f3f7;
        }
        :root:not([data-theme='light']) #splash p {
          color: #9d9da8;
        }
      }
      :root[data-theme='dark'] #splash {
        background: #0c0c11;
        color: #f3f3f7;
      }
      :root[data-theme='dark'] #splash p {
        color: #9d9da8;
      }
      /* Only the untransformed parts get fill-box; the mark and wordmark carry transform attributes. */
      #splash .logo-eye,
      #splash .logo-face {
        transform-box: fill-box;
        transform-origin: center;
      }
      #splash .logo-mark {
        animation: splash-fade 150ms var(--splash-ease) var(--splash-delay) both;
      }
      #splash .logo-screen {
        animation: splash-light 300ms var(--splash-ease) calc(var(--splash-delay) + 100ms) both;
      }
      #splash .logo-eye {
        animation: splash-pop 250ms var(--splash-ease) calc(var(--splash-delay) + 350ms) both;
      }
      #splash .logo-eye + .logo-eye {
        animation-delay: calc(var(--splash-delay) + 410ms);
      }
      #splash .logo-smile {
        stroke-dasharray: 1;
        animation: splash-draw 250ms var(--splash-ease) calc(var(--splash-delay) + 500ms) both;
      }
      #splash .logo-wordmark {
        animation: splash-wipe 300ms var(--splash-ease) calc(var(--splash-delay) + 600ms) both;
      }
      #splash .logo-face {
        animation: splash-glance 3.2s ease-in-out calc(var(--splash-delay) + 1600ms) infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash svg * {
          animation: none;
        }
      }
      @keyframes splash-reveal {
        to {
          visibility: visible;
        }
      }
      @keyframes splash-fade {
        from {
          opacity: 0;
        }
      }
      @keyframes splash-light {
        from {
          fill: #2b2150;
        }
      }
      @keyframes splash-pop {
        from {
          transform: scale(0);
        }
      }
      /* Hidden at 0%: a round cap draws a dot even on a zero-length dash. */
      @keyframes splash-draw {
        0% {
          stroke-dashoffset: 1;
          opacity: 0;
        }
        1% {
          opacity: 1;
        }
      }
      @keyframes splash-wipe {
        from {
          clip-path: inset(0 100% 0 0);
        }
        to {
          clip-path: inset(0 0 0 0);
        }
      }
      @keyframes splash-glance {
        0%,
        40%,
        100% {
          transform: translateX(0);
        }
        15%,
        25% {
          transform: translateX(-2px);
        }
        55%,
        65% {
          transform: translateX(2px);
        }
      }
    </style>
