name: pagercutie

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pagercutie
      POSTGRES_PASSWORD: pagercutie
      POSTGRES_DB: pagercutie
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagercutie -d pagercutie"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Shared state of the backend replicas: dedup windows, occurrence counters, throttles (SPEC §5).
  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot: applies migrations, then the backend starts.
  migrate:
    build: &backend-build
      context: .
      dockerfile: backend/Dockerfile
    image: pagercutie-backend
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://pagercutie:pagercutie@postgres:5432/pagercutie
    depends_on:
      postgres:
        condition: service_healthy

  # Every replica runs the API, ingest and all background loops (SPEC §3.2). Scale with
  # `docker compose up -d --scale backend=3`; the frontend Caddy balances across the replicas (ADR-0044).
  backend:
    build: *backend-build
    image: pagercutie-backend
    restart: unless-stopped
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://pagercutie:pagercutie@postgres:5432/pagercutie
      APP_REDIS_URL: redis://redis:6379/0
      APP_LOG_JSON: "true"
      # The backend creates this admin on start when no admin exists; log in with this email (passwordless, ADR-0024).
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      # Traces, metrics and events go to Grafana LGTM (ADR-0046); APP_OTEL_ENABLED=false turns the export off.
      APP_OTEL_ENABLED: ${APP_OTEL_ENABLED:-true}
      APP_OTEL_ENDPOINT: http://otel-lgtm:4318
      # Stable HTTP semantic conventions; the Grafana dashboard queries their metric and label names.
      OTEL_SEMCONV_STABILITY_OPT_IN: http
    depends_on:
      otel-lgtm:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      # A range, so scaled replicas each get a host port; the first replica is on 8000.
      - "${BACKEND_PORTS:-8000-8009}:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: pagercutie-frontend
    ports:
      # 5173 is what e2e/playwright.config.ts expects by default.
      - "${FRONTEND_PORT:-5173}:8080"
    environment:
      BACKEND_HOST: backend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Grafana with Prometheus, Tempo, Loki and Pyroscope behind one OTLP collector (SPEC §13). Grafana logs in anonymously as admin.
  otel-lgtm:
    image: grafana/otel-lgtm:0.41.1
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/pagercutie-dashboards/pagercutie.json
    volumes:
      - lgtm-data:/data
      - ./observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/pagercutie.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/pagercutie-dashboards:ro
    # The image's own check, polled faster than its 30 s default so `--wait` returns soon after startup.
    healthcheck:
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 3s
      timeout: 5s
      retries: 40

volumes:
  postgres-data:
  lgtm-data:
