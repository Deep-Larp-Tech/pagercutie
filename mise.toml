[tools]
# Also the source of truth for the Docker images (backend/Dockerfile, frontend/Dockerfile).
node = "26.13.1"
pnpm = "12.21.0"
uv = "0.13.9"
python = "3.14.4"

[tasks.e2e]
description = "Run Playwright end-to-end tests"
run = "pnpm --filter e2e test"

[tasks."e2e:ui"]
description = "Open the Playwright UI mode for the end-to-end tests"
run = "pnpm --filter e2e test:ui"

[tasks.up]
description = "Start local infrastructure for `mise run dev` (Postgres, Redis, Mailpit, Grafana LGTM)"
run = "docker compose up -d --wait postgres redis mailpit otel-lgtm"

[tasks.stack]
description = "Build and run the whole stack in containers: frontend on :5173, backend on :8000 (scale with --scale backend=N)"
run = "docker compose up -d --build --wait"

[tasks.dev]
description = "Run the backend with reload (needs Postgres and Redis from `mise run up`)"
dir = "backend"
depends = ["up", "migrate"]
env = { APP_OTEL_ENABLED = "true", OTEL_SEMCONV_STABILITY_OPT_IN = "http" }
run = "uv run fastapi dev src/pagercutie/asgi.py"

[tasks.migrate]
description = "Apply database migrations"
dir = "backend"
run = "uv run alembic upgrade head"

[tasks.migration]
description = "Autogenerate a migration: mise run migration -- \"add foo\". Read and edit it before committing!"
dir = "backend"
run = "uv run alembic revision --autogenerate -m"

[tasks.test]
description = "Run backend tests (needs Docker for Testcontainers)"
dir = "backend"
run = "uv run pytest"

[tasks."test:unit"]
description = "Run backend unit and property tests (no Docker)"
dir = "backend"
run = "uv run pytest tests/unit tests/property"

[tasks."test:integration"]
description = "Run backend integration tests (needs Docker for Testcontainers)"
dir = "backend"
run = "uv run pytest tests/integration"

[tasks."test:contract"]
description = "Run the schemathesis contract test against the management API (needs Docker for Testcontainers)"
dir = "backend"
run = "uv run pytest tests/contract"

[tasks.lint]
description = "Lint, format check, type check and import-contract check the backend"
depends = ["lint:ruff", "lint:ty", "lint:imports"]

[tasks."lint:ruff"]
description = "Lint and format check the backend with ruff"
dir = "backend"
run = ["uv run ruff check", "uv run ruff format --check"]

[tasks."lint:imports"]
description = "Check the pipeline stage boundaries with import-linter (contracts in backend/pyproject.toml)"
dir = "backend"
run = "uv run lint-imports"

[tasks."lint:ty"]
description = "Type check the backend with ty"
dir = "backend"
run = "uv run ty check"

[tasks.contract]
description = "Export the OpenAPI contract consumed by orval, and the rule / runbook JSON Schemas"
dir = "backend"
run = [
    "uv run python -m pagercutie.export_openapi ../contract/openapi.json",
    "uv run python -m pagercutie.export_schemas ../contract",
]

[tasks.api]
description = "Regenerate the contract and the frontend API client (react-query hooks, zod, msw mocks)"
depends = ["contract"]
dir = "frontend"
run = "pnpm api"

[tasks."contract:check"]
description = "Fail if contract/openapi.json or the rule / runbook JSON Schemas are stale"
dir = "backend"
run = """
mise run contract
test -z "$(git status --porcelain -- ../contract/openapi.json ../contract/rule.schema.json ../contract/runbook.schema.json)" || { git status --short -- ../contract; echo 'contract is stale: run mise run contract and commit' >&2; exit 1; }
"""

[tasks.demo]
description = "Start the stack and seed the demo teams, schemas, sources, runbooks and rules (demo/README.md)"
run = [
    "docker compose -f demo/compose.yaml up -d --build --wait",
    "docker compose -f demo/compose.yaml run --rm --build demo-seed",
]

[tasks."demo:load"]
description = "Ingest load over every demo source with a 40 ms netem delay: mise run demo:load -- --duration 60"
run = "docker compose -f demo/compose.yaml run --rm --build demo-load"
