name: e2e

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter e2e typecheck
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      # Its own step, so build and startup failures read apart from test failures; Playwright reuses the stack.
      - run: docker compose up --detach --build --wait
      - run: mise run e2e
      - if: failure()
        run: mkdir -p e2e/test-results && docker compose logs --no-color > e2e/test-results/compose.log 2>&1
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-results
          path: e2e/test-results/
          retention-days: 7
