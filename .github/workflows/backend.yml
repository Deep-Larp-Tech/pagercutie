name: backend

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Fail instead of re-resolving when backend/uv.lock is stale, so CI tests the committed lock.
  UV_LOCKED: "1"
  RUFF_OUTPUT_FORMAT: github

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ruff
            task: lint:ruff
          - name: ty
            task: lint:ty
          - name: unit and property tests
            task: test:unit
          # Testcontainers starts Postgres on the runner's Docker daemon.
          - name: integration tests
            task: test:integration
          - name: schemathesis
            task: test:contract
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: mise run ${{ matrix.task }}
