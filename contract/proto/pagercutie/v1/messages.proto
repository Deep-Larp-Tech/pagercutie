syntax = "proto3";

package pagercutie.v1;

// Topic `events`, produced by ingest.
message Event {
  // UUIDv7, assigned by ingest.
  string event_id = 1;
  // Source instance ID from config, e.g. "payments-webhook".
  string source = 2;
  // Resolved by ingest (SPEC §7).
  string schema_id = 3;
  // Ingest time; basis for end-to-end latency.
  int64 received_at_ms = 4;
  // Event body as JSON, whatever the original wire format was.
  bytes payload = 5;
  // Normalised: "debug" | "info" | "warn" | "error" | "critical" (SPEC §8.1).
  string severity = 6;
}

// Topic `matches`, produced by the evaluator. One per (event, matching rule).
message Match {
  string event_id = 1;
  string rule_id = 2;
  // Hex SHA-256 of the rule's dedup field values (SPEC §9).
  string fingerprint = 3;
  // Copied from Event.
  int64 received_at_ms = 4;
  // Copied from Event, for templating.
  bytes payload = 5;
}

// Topic `deliveries`, produced by dedup.
message Delivery {
  // Deterministic: hash(alert_id, recipient_id, channel, notification_seq).
  string delivery_id = 1;
  string alert_id = 2;
  string recipient_id = 3;
  // "email" | "sms" | "phone" | "ui".
  string channel = 4;
  // Copied from the first Match.
  int64 received_at_ms = 5;
}
