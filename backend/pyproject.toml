[project]
name = "pagercutie"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "jsonschema-rs>=0.61.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-redis>=0.66b2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "orjson>=3.13.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "hypothesis>=6.170.15",
    "import-linter>=2.17",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "schemathesis>=4.33.4",
    "testcontainers[postgres,redis]>=4.15.0",
    "time-machine>=3.6.0",
    "ty>=0.0.107",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "TID", "SIM", "RUF"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Models are never exposed. TODO: Add new rules here when creating new modules / entities.
"pagercutie.alerts.models".msg = "Routers must not import models, go through services and DTOs"
"pagercutie.audit.models".msg = "Routers must not import models, go through services and DTOs"
"pagercutie.auth.models".msg = "Routers must not import models, go through services and DTOs"
"pagercutie.event_schemas.models".msg = "Routers must not import models, go through services and DTOs"
"pagercutie.rules.models".msg = "Routers must not import models, go through services and DTOs"
"pagercutie.runbooks.models".msg = "Routers must not import models, go through services and DTOs"
"pagercutie.sources.models".msg = "Routers must not import models, go through services and DTOs"
"pagercutie.teams.models".msg = "Routers must not import models, go through services and DTOs"
"pagercutie.users.models".msg = "Routers must not import models, go through services and DTOs"

[tool.ruff.lint.per-file-ignores]
"!src/**/router.py" = ["TID251"]

# Pipeline boundaries (ADR-0045, SPEC §5.5). Run with `mise run lint:imports`.
[tool.importlinter]
root_package = "pagercutie"

[[tool.importlinter.contracts]]
name = "Pipeline stages do not import each other"
type = "independence"
modules = [
    "pagercutie.pipeline.ingest",
    "pagercutie.pipeline.evaluation",
    "pagercutie.pipeline.dedup",
    "pagercutie.pipeline.routing",
    "pagercutie.pipeline.dispatch",
    "pagercutie.pipeline.executor",
]

[[tool.importlinter.contracts]]
name = "Only the orchestrator chains the stages"
type = "forbidden"
source_modules = [
    "pagercutie.pipeline.ingest",
    "pagercutie.pipeline.evaluation",
    "pagercutie.pipeline.dedup",
    "pagercutie.pipeline.routing",
    "pagercutie.pipeline.dispatch",
    "pagercutie.pipeline.executor",
]
forbidden_modules = ["pagercutie.pipeline.orchestrator"]

[[tool.importlinter.contracts]]
name = "Entity packages do not depend on the pipeline"
type = "forbidden"
source_modules = [
    "pagercutie.alerts",
    "pagercutie.audit",
    "pagercutie.auth",
    "pagercutie.event_schemas",
    "pagercutie.health",
    "pagercutie.preferences",
    "pagercutie.rules",
    "pagercutie.runbooks",
    "pagercutie.sources",
    "pagercutie.teams",
    "pagercutie.users",
    "pagercutie.core",
]
forbidden_modules = ["pagercutie.pipeline"]

# Who may import each stage's entrypoints (SPEC §5.5, ADR-0111). In-request stages are called by the orchestrator;
# `adapters` and `state` hold their caches and types, and `main` builds the ingest schema cache.
# `tests/unit/test_import_contracts.py` fails when a stage has no contract here.
[[tool.importlinter.contracts]]
name = "Only the orchestrator, the ingest adapters and their state import the ingest stage"
type = "protected"
protected_modules = ["pagercutie.pipeline.ingest.stage"]
allowed_importers = [
    "pagercutie.pipeline.ingest",
    "pagercutie.pipeline.orchestrator",
    "pagercutie.pipeline.adapters",
    "pagercutie.pipeline.state",
    "pagercutie.main",
]

[[tool.importlinter.contracts]]
name = "Only the orchestrator, the ingest adapters and their state import the evaluation stage"
type = "protected"
protected_modules = ["pagercutie.pipeline.evaluation.stage"]
allowed_importers = [
    "pagercutie.pipeline.evaluation",
    "pagercutie.pipeline.orchestrator",
    "pagercutie.pipeline.adapters",
    "pagercutie.pipeline.state",
]

[[tool.importlinter.contracts]]
name = "Only the orchestrator and the ingest state import the dedup stage"
type = "protected"
protected_modules = ["pagercutie.pipeline.dedup.stage"]
allowed_importers = ["pagercutie.pipeline.dedup", "pagercutie.pipeline.orchestrator", "pagercutie.pipeline.state"]

[[tool.importlinter.contracts]]
name = "Only the orchestrator imports the routing stage"
type = "protected"
protected_modules = ["pagercutie.pipeline.routing.stage"]
allowed_importers = ["pagercutie.pipeline.routing", "pagercutie.pipeline.orchestrator"]

[[tool.importlinter.contracts]]
name = "Only the dispatch package imports the dispatch stage"
type = "protected"
protected_modules = ["pagercutie.pipeline.dispatch.stage"]
allowed_importers = ["pagercutie.pipeline.dispatch"]

[[tool.importlinter.contracts]]
name = "Only the orchestrator imports the executor stage"
type = "protected"
protected_modules = ["pagercutie.pipeline.executor.stage"]
allowed_importers = ["pagercutie.pipeline.executor", "pagercutie.pipeline.orchestrator"]
