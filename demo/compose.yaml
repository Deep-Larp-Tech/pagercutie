name: pagercutie

include:
  - ../compose.yaml

x-demo: &demo
  build: .
  image: pagercutie-demo
  profiles: [demo]
  environment:
    DEMO_BASE_URL: http://frontend:8080/api
    DEMO_STATE: /state/demo-state.json
  volumes:
    - demo-state:/state
  depends_on:
    frontend:
      condition: service_healthy

services:
  demo-seed:
    <<: *demo
    command: ["python", "seed.py"]

  demo-load:
    <<: *demo
    cap_add: [NET_ADMIN]
    entrypoint: ["./load.sh"]
    command: []

volumes:
  demo-state:
